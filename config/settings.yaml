# TradeBot configuration. Edit watchlists and parameters here.

# Markets used by "all" in scans, paper trading and the dashboard. India still works with -m india.
active_markets: [us, crypto]

watchlists:
  us:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - JPM
    - XOM
    - SPY
  crypto:           # Yahoo crypto tickers end in -USD; candles close at 00:00 UTC
    - BTC-USD
    - ETH-USD
    - SOL-USD
    - BNB-USD
    - XRP-USD
    - ADA-USD
    - AVAX-USD
    - LINK-USD
    - DOGE-USD
  india:            # NSE symbols use .NS, BSE symbols use .BO
    - RELIANCE.NS
    - TCS.NS
    - INFY.NS
    - HDFCBANK.NS
    - ICICIBANK.NS
    - ITC.NS
    - LT.NS
    - SBIN.NS
    - ^NSEI          # Nifty 50 index: scanned for reference, never traded

strategy:
  name: sma_crossover      # default: sma_crossover | rsi_reversion | macd_trend | composite
  params: {}               # overrides for the default strategy's settings
  by_market:               # per-market choices (markets not listed use `name`)
    us: sma_crossover      # best on the survivorship-free S&P 500 test (docs/PROJECT_PLAN.md)
    crypto: macd_trend     # best on the crypto watchlist walk-forward test

data:
  lookback_days: 500       # history fetched for scans
  cache_dir: data_cache
  cache_ttl_minutes: 60    # re-download a symbol at most once an hour

risk:
  risk_per_trade: 0.01     # risk 1% of account per trade
  atr_period: 14
  atr_stop_mult: 2.0       # stop = entry - 2 * ATR
  reward_risk: 2.0         # target = entry + 2 * (entry - stop)
  max_position_pct: 0.20   # never put more than 20% of the account in one stock
  max_positions: 8         # most stocks held at once per account
  max_per_sector: null     # most open positions in one sector (uses `sectors:` below); null = no cap.
                           # On the S&P 500 test, 2 per sector cut SMA crossover's worst drop but not MACD's.

# GICS sector of each stock, for risk.max_per_sector. Symbols not listed are never capped.
sectors:
  AAPL: Information Technology
  MSFT: Information Technology
  NVDA: Information Technology
  GOOGL: Communication Services
  META: Communication Services
  AMZN: Consumer Discretionary
  JPM: Financials
  XOM: Energy

backtest:
  years: 5
  benchmark:               # index to compare portfolio backtests against
    us: SPY
    crypto: BTC-USD
    india: ^NSEI

costs:                     # per side, as a fraction of trade value
  us:
    commission: 0.0
    slippage: 0.0005
  crypto:
    commission: 0.001      # typical exchange taker fee (0.1%)
    slippage: 0.001
  india:
    commission: 0.001      # approx. brokerage + STT + charges for delivery trades
    slippage: 0.0005

paper:
  ledger_path: state/paper_ledger.json
  starting_capital:
    us: 10000              # USD
    crypto: 10000          # USD
    india: 500000          # INR

alerts:
  console: true            # print to the terminal / state/logs/daily.log
  macos: true              # notification banner on this Mac
  telegram: true          # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env (see README)

# `tradebot schedule install` runs `tradebot daily` once a day after this time, in this timezone
# (whatever timezone the Mac is set to). It should be after 16:15 New York time (US candle final)
# and after 00:00 UTC (crypto candle final); 20:15 New York time satisfies both all year.
# Re-run `tradebot schedule install` after changing these.
schedule:
  time: "20:15"
  timezone: America/New_York

# Phase 5: send TradeBot's orders to an Alpaca account (README: "Broker: Alpaca").
# Keys go in .env: ALPACA_PAPER_KEY_ID / ALPACA_PAPER_SECRET_KEY (and separate LIVE keys for live).
broker:
  enabled: true            # true: `tradebot daily` also sends orders to Alpaca
  mode: paper              # paper = simulated money, orders sent automatically
                           # live  = real money; orders are only PROPOSED and each needs a typed
                           #         `yes` in `tradebot broker confirm`
  markets: [us, crypto]
  daily_loss_limit: 0.03   # no new buys after the account falls 3% in a day
  max_order_value: 2000    # USD cap per order
  max_orders_per_run: 5    # most new buys per daily run
  crypto_stop_limit_gap: 0.01  # crypto stop-limit sells may fill down to 1% below the stop

# AI market study: Claude reads recent news and the market's mood once a day (needs ANTHROPIC_API_KEY
# in .env and `pip install -e '.[ai]'`). It can only hold back BUYs, never add trades. Try it with
# `tradebot ai study` before turning it on.
ai_study:
  enabled: true
  model: claude-opus-5-5
  effort: low              # low | medium | high: deeper thinking costs more
  veto: true               # false = show the AI view in alerts but never hold back a BUY
  min_confidence: 0.7      # a bearish rating must be at least this sure to hold back a BUY
  market_veto: true        # also hold back BUYs when the whole market is rated bearish
  max_headlines: 6         # per symbol
  max_age_hours: 12        # reuse a study younger than this
