[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Swing-trading signal bot for US and Indian stocks with backtesting and paper trading"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dashboard = ["streamlit>=1.40", "plotly>=5.18", "watchdog>=4"]
research = ["lxml>=4.9"]
ai = ["anthropic>=0.100"]  # AI market study (`tradebot ai`); Python 3.9 gets the last 0.x release  # `tradebot universe update` parses Wikipedia tables

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:urllib3 v2 only supports OpenSSL"]
